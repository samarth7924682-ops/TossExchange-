<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Master Coin Ledger</title>
    <style>
        :root { --primary: #4a3a0f; --primary-light: #7a5c17; --accent: #ffd700; --bg: #f7f3e8; --green: #2e7d32; --red: #d32f2f; --shadow-sm: 0 2px 6px rgba(74,58,15,0.12); color-scheme: light only; }
        html { color-scheme: light only; }
        body { font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #2b2410; margin: 0; padding: 0; font-size: 12px; }
        * { box-sizing: border-box; font-family: inherit; }

        .container { padding: 8px 10px; max-width: 800px; margin: 0 auto; }

        /* LEDGER LIST */
        .ledger-wrapper { background: white; border-radius: 8px; box-shadow: var(--shadow-sm); overflow: hidden; }
        .ledger-header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #ffd700; padding: 7px 10px; font-weight: 900; font-size: 11px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }

        /* 📏 2-LINE SLIM STRIP — top: remark+date | bottom: full-width thin amount bar, kabhi cut nahi hoga */
        .strip { display: flex; flex-direction: column; padding: 5px 8px; border-bottom: 1px solid #f0ead2; gap: 3px; }
        .strip:hover { background: #fdf9ee; }
        .strip-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; overflow: hidden; }
        .remark-txt { font-size: 10px; font-weight: 800; color: #2b2410; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .date-txt { font-size: 8.5px; color: #8a7a4f; font-weight: 700; white-space: nowrap; flex-shrink: 0; }

        .strip-bottom { display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #fdf9ee; border: 1px solid #eddfb0; border-radius: 5px; padding: 3px 6px; }
        .running-bal { font-size: 9px; color: #7a6b4a; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .amt-txt { font-size: 10.5px; font-weight: 900; white-space: nowrap; flex-shrink: 0; }
        .text-green { color: var(--green); }
        .text-red { color: var(--red); }

        .no-data { padding: 20px; text-align: center; color: #8a7a4f; font-weight: 800; font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ledger List -->
        <div class="ledger-wrapper">
            <div class="ledger-header">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <a href="#" id="back-btn" style="color: #ffd700; text-decoration: none; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; font-size: 15px; line-height: 1;">←</a>
                    <span>Transaction Details</span>
                </div>
                <span>Amount / Bal</span>
            </div>
            <div id="ledger-list">
                <div class="no-data">Loading ledger records... ⏳</div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>

    <script>
        // 1. Authenticate Session
        const sessionStr = localStorage.getItem('adminSession');
        if(!sessionStr) { window.location.href = "index.html"; }
        const adminSession = JSON.parse(sessionStr);

        let targetSaId = null;

        // 2. Determine whose ledger to show based on Role
        if (adminSession.role === 'subadmin') {
            targetSaId = adminSession.id;
            document.getElementById('back-btn').href = "subadmin-dashboard.html";
        } 
        else if (adminSession.role === 'master') {
            const urlParams = new URLSearchParams(window.location.search);
            targetSaId = urlParams.get('id');
            document.getElementById('back-btn').href = "master-subadmins.html";
            
            if(!targetSaId) {
                alert("❌ No SubAdmin selected! Going back.");
                window.location.href = "master-subadmins.html";
            }
        }

        // 3. Fetch Transactions
        function loadLedger() {
            db.collection("transactions")
              .where("userId", "==", targetSaId)
              .onSnapshot(snap => {
                  let records = [];

                  snap.forEach(doc => {
                      let tx = doc.data();
                      // Only pick transactions marked as "Master" and Approved
                      if(tx.remark && tx.remark.includes('Master') && tx.status === 'approved') {
                          records.push(tx);
                      }
                  });

                  // Sort Oldest to Newest to calculate running balance correctly
                  records.sort((a,b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));

                  const listEl = document.getElementById('ledger-list');
                  listEl.innerHTML = "";

                  if(records.length === 0) {
                      listEl.innerHTML = `<div class="no-data">No transactions found with Master Admin.</div>`;
                      return;
                  }

                  let runningBalance = 0;
                  let finalUIArray = [];

                  records.forEach(tx => {
                      let amt = parseFloat(tx.amount || 0);
                      let isDeposit = (tx.type === 'deposit'); // Deposit MEANS Subadmin RECEIVED from Master
                      
                      let oldBal = runningBalance; // Store old balance before transaction
                      
                      if(isDeposit) {
                          runningBalance += amt;
                      } else {
                          runningBalance -= amt;
                      }
                      
                      let newBal = runningBalance; // Store new balance after transaction

                      let colorClass = isDeposit ? "text-green" : "text-red";
                      let sign = isDeposit ? "+" : "-";
                      let remarkText = isDeposit ? "Received from Master" : "Returned to Master";
                      let dateStr = tx.timestamp ? tx.timestamp.toDate().toLocaleDateString([], {day:'2-digit', month:'short', year:'numeric'}) : 'Just now';

                      finalUIArray.unshift(`
                          <div class="strip" style="border-left: 3px solid ${isDeposit ? 'var(--green)' : 'var(--red)'}">
                              <div class="strip-top">
                                  <span class="remark-txt">${remarkText}</span>
                                  <span class="date-txt">${dateStr}</span>
                              </div>
                              <div class="strip-bottom">
                                  <span class="running-bal">Total: ${newBal.toFixed(2)}</span>
                                  <span class="amt-txt ${colorClass}">${sign}${amt.toFixed(2)}</span>
                              </div>
                          </div>
                      `);
                  });

                  // Update UI
                  listEl.innerHTML = finalUIArray.join('');
              });
        }

        if(targetSaId) loadLedger();

    </script>
</body>
</html>
