<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>⚡ TOSS EXCH - Betting</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Segoe+UI&display=swap" rel="stylesheet">
    <style>
        :root { --theme-dark: #121418; --green: #008000; --red: #ff0000; --accent: #ffb703; --bg: #eceff4; --blue-light: #b3d4f5; --blue-dark: #2e3d68; color-scheme: light; }
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
       .premium-header { background: var(--theme-dark); color: white; padding: 15px 10px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
       html.embedded .premium-header { display: none !important; }
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo-text { font-size: clamp(17px, 5vw, 22px); font-weight: 900; color: white; letter-spacing: 0.5px; cursor: pointer; }
        .logo-coin { display: inline-block; animation: miniFlip 2s linear infinite; transform-origin: center; }
        .logo-dollar { letter-spacing: -3px; }
        @keyframes miniFlip { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
        
        .header-info { display: flex; gap: 8px; justify-content: center; width: 100%; }
        .badge { background: #222; padding: 5px 12px; border-radius: 20px; font-size: 11px; color: var(--accent); font-weight: bold; border: 1px solid #444; text-align: center; cursor: pointer; transition: 0.2s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .badge:active { transform: scale(0.95); }

        .dropdown-box { position: absolute; right: 10px; top: 80px; background: white; color: black; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: none; flex-direction: column; z-index: 1001; }
        .user-dropdown { min-width: 150px; }
        .user-dropdown a { padding: 10px 12px; text-decoration: none; color: #222; font-weight: bold; font-size: 13px; border-bottom: 1px solid #eee; display: block;}

        .exp-dropdown { min-width: 220px; max-height: 300px; overflow-y: auto; right: auto; left: 50%; transform: translateX(-50%); }
        .exp-header { padding: 8px; font-size: 11px; color: #888; text-align: center; border-bottom: 1px solid #eee; background: #f8f9fa; border-radius: 6px 6px 0 0; }
        .exp-strip { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .exp-strip:hover { background: #f0f0f0; border-left: 3px solid var(--accent); }
        .exp-match-name { max-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .exp-amt { color: #d32f2f; font-family: monospace; font-size: 14px; }

        .container { padding: clamp(8px, 3vw, 16px); max-width: 600px; margin: 0 auto; }
        .card { background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.2); overflow: hidden; margin-bottom:15px; border-top: 2px solid #2e3d68;}
        
        .market-header-row { display: flex; background: #f8f9fa; border-bottom: 2px solid #ddd; padding: 8px; font-size: 12px; font-weight: 900;}
        .match-when { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 13px; font-weight: 800; color: #222; }
        .when-pill { background: #111; color: #ffc107; padding: 3px 10px; border-radius: 12px; font-size: 11px; letter-spacing: .5px; }
        .market-title { flex: 1; color: #111; }
        .market-lbl-back { width: 60px; text-align: center; color: #1565c0; }
        .market-lbl-lay { width: 60px; text-align: center; color: #c62828; }

        .market-table { width: 100%; border-collapse: collapse; background: white; }
        .market-table td { padding: 10px 8px; border-bottom: 1px solid #ddd; vertical-align: middle;}
        .team-name { font-weight: 900; font-size: clamp(13px, 3.6vw, 16px); display: block; color: #111; }
        
        .pnl-container { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .pnl-text { font-size: 12px; font-weight: 900; display: inline-block; }
        .proj-text { font-size: 11px; font-weight: 900; font-style: italic; display: none; }
        
        .green-pnl { color: var(--green); }
        .red-pnl { color: var(--red); }
        
        .odds-cell { width: 65px; background: #a5d5ff; text-align: center; border: 1px solid #fff; cursor: pointer; transition: 0.1s;}
        .odds-cell:active { background: #8bc1f0; }
        .odds-val { font-weight: 900; font-size: clamp(14px, 4vw, 17px); color: #111; display: block;}
        .odds-vol { font-size: 10px; color: #444; display: block;}

        .lay-cell { width: 65px; background: #ffcdd2; text-align: center; border: 1px solid #fff; opacity: 0.6; pointer-events: none;}

        /* CSS for Default Locked State */
        .locked-state { opacity: 0.5 !important; pointer-events: none !important; }

        .betslip-container { background: linear-gradient(180deg, #d6e7f9 0%, #bcd6f2 50%, #a2c4ea 100%); display: none; flex-direction: column; padding: 10px; border-bottom: 2px solid #999; position: relative;}
        
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        
       .odds-adjust-box { flex: 1; display: flex; background: linear-gradient(180deg, #ffffff 0%, #dbe9f8 55%, #c1d8f1 100%); border: 1px solid #2e3d68; align-items: center; height: 40px; }
        .odds-adjust-box button { background: var(--blue-dark); border: none; color: white; padding: 0 16px; font-weight: 900; font-size: 16px; cursor: pointer; height: 100%;}
        .odds-adjust-box input { flex: 1; width: 100%; text-align: center; border: none; font-weight: 900; font-size: 17px; outline: none; background: transparent; color: #111;}
        
       .stake-input-box { flex: 1; height: 40px; background: linear-gradient(180deg, #ffffff 0%, #dbe9f8 55%, #c1d8f1 100%); }
        .stake-input-box input { width: 100%; height: 100%; box-sizing: border-box; text-align: center; border: none; font-weight: 900; font-size: 17px; outline: none; color: #111; background: transparent; border: 1px solid #b6cde8;}
        
        .stake-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-bottom: 2px; }
        
        .stake-btn { background: linear-gradient(180deg, #ffffff, #e3eefa); border: 1px solid #cbe0f5; height: 34px; padding: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--green); cursor: pointer; font-size: 13px; transition: 0.1s; }
        .stake-btn:active { background: #eee; }
        .stake-btn.edit-mode { animation: wiggle 0.5s infinite; border: 1px dashed red; }
        
        @keyframes wiggle { 0% {transform: rotate(0deg);} 25% {transform: rotate(-2deg);} 50% {transform: rotate(0deg);} 75% {transform: rotate(2deg);} 100% {transform: rotate(0deg);} }

        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-bottom: 4px; }
        .act-btn { height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11px; border: none; cursor: pointer; color: white; }
        .btn-min { background: #ffc107; color: black; }
        .btn-max { background: var(--blue-dark); }
        .btn-edit { background: var(--green); }
        .btn-clear { background: var(--red); }
        
       .final-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; position: relative; min-height: 40px; }
        .btn-cancel { background: #ff7b7b; height: 40px; padding: 0; border: none; font-weight: 900; font-size: 14px; color: white; cursor: pointer; }
        .btn-place { background: var(--green); height: 40px; padding: 0; border: none; font-weight: 900; font-size: 14px; color: white; cursor: pointer; }
        .betslip-container.placing { pointer-events: none; }
        .betslip-container.placing .final-grid button { visibility: hidden; }
        .betslip-container.placing .final-grid::after { content: ''; position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 3px solid rgba(27,143,58,.25); border-top-color: #1b8f3a; border-radius: 50%; animation: bspin .7s linear infinite; }
        @keyframes bspin { to { transform: rotate(360deg); } }
#bet-success-pop { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translate(-50%, -150%); z-index: 99998; width: calc(100% - 28px); max-width: 420px; background: #1b8f3a; color: #fff; padding: 10px 16px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.35); text-align: center; transition: transform .28s ease; pointer-events: none; }
        #bet-success-pop.show { transform: translate(-50%, 0); }
        .bsp-title { font-size: 15px; font-weight: 900; }
        .bsp-sub { font-size: 12px; font-weight: 600; margin-top: 3px; opacity: .95; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>

    <script>
        function goHome() { if (window.self !== window.top) { window.parent.postMessage('page-home', '*'); } else { window.location.href = 'index.html'; } }
       // 📊 READ COUNTER — kaun sa source kitni reads kar raha hai (tap karo to list khulegi)
        const RC_KEY = 'masterReadCounter';
        let RC_DATA = {}, RC_SESS = {}, RC_OPEN = false;
        try { RC_DATA = JSON.parse(localStorage.getItem(RC_KEY) || '{}'); } catch (e) {}
        function RC(name, n, snap) {
            if (!n) return;
            if (snap && snap.metadata && snap.metadata.fromCache) name += ' (cache-free)';
            const day = new Date().toISOString().slice(0, 10);
            if (!RC_DATA[day]) {
                RC_DATA[day] = {};
                Object.keys(RC_DATA).sort().slice(0, -7).forEach(k => delete RC_DATA[k]); // sirf pichhle 7 din rakho
            }
            RC_DATA[day][name] = (RC_DATA[day][name] || 0) + n;
            RC_SESS[name] = (RC_SESS[name] || 0) + n;
            try { localStorage.setItem(RC_KEY, JSON.stringify(RC_DATA)); } catch (e) {}
            if (localStorage.getItem('rcDebug') === '1') console.log('READS +' + n + ' ' + name);
            RC_render();
        }
        function RC_sum(o) { let t = 0; for (const k in o) if (k.indexOf('(cache-free)') < 0) t += o[k]; return t; }
        function RC_render() {
            if (!document.body) return;
            let el = document.getElementById('rc-box');
            if (!el) {
                el = document.createElement('div');
                el.id = 'rc-box';
                el.style.cssText = 'position:fixed;left:6px;bottom:6px;z-index:99999;background:#000c;color:#0f0;font:11px monospace;padding:4px 8px;border-radius:6px;max-width:92vw;white-space:pre-wrap;';
                el.onclick = () => { RC_OPEN = !RC_OPEN; RC_render(); };
                document.body.appendChild(el);
            }
            const day = new Date().toISOString().slice(0, 10);
            const d = RC_DATA[day] || {};
            let txt = '📊 aaj ' + RC_sum(d) + ' | is baar ' + RC_sum(RC_SESS);
            if (RC_OPEN) {
                txt += '\n-- aaj --\n' + Object.keys(d).map(k => k + ': ' + d[k]).join('\n');
                txt += '\n-- is baar --\n' + Object.keys(RC_SESS).map(k => k + ': ' + RC_SESS[k]).join('\n');
            }
            el.textContent = txt;
        }
        RC_render();
        const matchId = new URLSearchParams(window.location.search).get('id');
        function getCachedFirst(ref) {
            return ref.get({ source: 'cache' }).catch(() => null).then(s => {
                if (s && (s.exists === undefined ? !s.empty : s.exists)) return s;
                return ref.get();
            });
        }
        if(!matchId) goHome();

        const session = localStorage.getItem('userSession');
        if(!session) goHome();
        const user = JSON.parse(session);
        document.getElementById('top-user').innerText = user.username;
        let _syncServerMs = Date.now();
        let _syncPerfMs = performance.now();
        let _timeSynced = false;
        let _needResync = false; // phone background/sleep ke baad true — turant server se re-sync
        function isTimeTrusted() { return _timeSynced && !_needResync; }

        function getTrueTime() {
            return _syncServerMs + (performance.now() - _syncPerfMs);
        }

        // ===== ADMIN TIME (IST) — phone ke time/timezone se koi matlab nahi =====
        const ADMIN_TZ_OFFSET_MS = 5.5 * 60 * 60 * 1000; // IST = UTC+5:30
        function _adminDate(ms) { return new Date(ms + ADMIN_TZ_OFFSET_MS); } // hamesha getUTC* se padhna hai
        function _dayKey(ms) {
            const d = _adminDate(ms);
            return d.getUTCFullYear() + '-' + d.getUTCMonth() + '-' + d.getUTCDate();
        }
        function _fmtTime(ms) {
            const d = _adminDate(ms);
            let h = d.getUTCHours();
            const mi = d.getUTCMinutes();
            const ap = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0') + ' ' + ap;
        }
        function getRelativeDateLabel(ms) {
            const nowMs = getTrueTime();
            if (_dayKey(ms) === _dayKey(nowMs)) return "TODAY";
            if (_dayKey(ms) === _dayKey(nowMs + 86400000)) return "TOMORROW";
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const d = _adminDate(ms);
            return d.getUTCDate() + ' ' + months[d.getUTCMonth()];
        }
        // Market ke upar: TODAY / TOMORROW + toss time (server time se)
        let _lastWhen = '';
        function renderWhen() {
            const el = document.getElementById('match-when');
            if (!el || !currentMatch || !currentMatch.tossTimeMs) return;
            const day = isTimeTrusted() ? getRelativeDateLabel(currentMatch.tossTimeMs) : '';
            const html = (day ? '<span class="when-pill">' + day + '</span>' : '') + '<span>' + _fmtTime(currentMatch.tossTimeMs) + '</span>';
            if (html !== _lastWhen) { el.innerHTML = html; _lastWhen = html; }
        }

        function _timeDeviceId() {
            let id = localStorage.getItem('_tsid');
            if (!id) {
                id = 'd_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
                localStorage.setItem('_tsid', id);
            }
            return id;
        }

        async function _sampleFirestore() {
            const ref = db.collection('_timeSync').doc(_timeDeviceId());
            const t0 = performance.now();
            await ref.set({ t: firebase.firestore.FieldValue.serverTimestamp() });
            const t1 = performance.now();
            const snap = await ref.get({ source: 'server' });
            RC('time-sync', 1);
            return { serverMs: snap.data().t.toMillis(), perf: t0 + (t1 - t0) / 2, rtt: t1 - t0 };
        }

        async function _sampleWorldTime() {
            const t0 = performance.now();
            const res = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC', { cache: 'no-store' });
            const data = await res.json();
            const t1 = performance.now();
            return { serverMs: new Date(data.utc_datetime).getTime(), perf: t0 + (t1 - t0) / 2, rtt: t1 - t0 };
        }

        let _syncing = null;

        async function _fetchTimed(url, parse) {
            const ctl = new AbortController();
            const to = setTimeout(() => ctl.abort(), 4000);
            try {
                const t0 = performance.now();
                const res = await fetch(url, { cache: 'no-store', signal: ctl.signal });
                const txt = await res.text();
                const t1 = performance.now();
                return { serverMs: parse(txt), perf: t0 + (t1 - t0) / 2, rtt: t1 - t0 };
            } finally { clearTimeout(to); }
        }
        const _FREE_TIME_SOURCES = [
            ['cloudflare', 'https://www.cloudflare.com/cdn-cgi/trace', t => { const m = t.match(/ts=([0-9.]+)/); if (!m) throw new Error('no ts'); return Math.round(parseFloat(m[1]) * 1000); }],
            ['timeapi.io', 'https://timeapi.io/api/Time/current/zone?timeZone=UTC', t => new Date(JSON.parse(t).dateTime.slice(0, 23) + 'Z').getTime()],
            ['worldtimeapi', 'https://worldtimeapi.org/api/timezone/Etc/UTC', t => new Date(JSON.parse(t).utc_datetime).getTime()]
        ];
        async function _sampleFreeTime() {
            // teeno free sources ek saath — jo pehle jawab de wahi use hota hai (Cloudflare aam taur par ~100ms)
            const tries = _FREE_TIME_SOURCES.map(([name, url, parse]) =>
                _fetchTimed(url, parse).then(s => { if (!s.serverMs || s.rtt >= 3000) throw new Error('slow'); return s; }));
            try { return await Promise.any(tries); } catch (e) { console.log('TIME free sources failed'); return null; }
        }

        // true tabhi jab IS call me fresh server time mil gaya
        async function syncServerTime(samples) {
            if (_syncing) return _syncing;
            _syncing = (async () => {
                let best = await _sampleFreeTime(); // 0 Firestore reads
                if (!best || best.rtt >= 3000) {    // free sources na mile tabhi Firestore
                    best = null;
                    for (let i = 0; i < (samples || 1); i++) {
                        try {
                            const s = await _sampleFirestore();
                            if (!best || s.rtt < best.rtt) best = s;
                        } catch (e) { console.log('Firestore time sync failed', e); }
                    }
                }
                if (best && best.rtt < 3000) {
                    _syncServerMs = best.serverMs;
                    _syncPerfMs = best.perf;
                    _needResync = false;
                    _timeSynced = true;
                    return true;
                }
                return false;
            })();
            try { return await _syncing; } finally { _syncing = null; }
        }

        setInterval(() => syncServerTime(1), 1800000); // 30 min
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') _needResync = true;
            else syncServerTime(1).then(applyLockState); // wapas aate hi turant server time (free, 0 reads)
        });

        // Start: sync hone tak retry, phir lock state lagao
        (function _retrySync() {
            syncServerTime(1).then(ok => {
                if (!ok) { setTimeout(_retrySync, 3000); return; }
                applyLockState();
            });
        })();
        let currentMatch = null;
        let selectedTeamKey = null;
        let currentBalance = 0;
        let currentMatchPnL = { teamA: 0, teamB: 0 }; 

        window.toggleMenu = function(menuId, e) { 
            e.stopPropagation(); 
            const menus = ['user-dropdown', 'exp-dropdown'];
            menus.forEach(id => {
                const el = document.getElementById(id);
                if (id === menuId) {
                    el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
                } else {
                    el.style.display = 'none';
                }
            });
        }
        
        window.onclick = function() { 
            document.getElementById('user-dropdown').style.display = 'none';

        }

        window.logout = function() { 
            localStorage.removeItem('userSession'); 
            window.location.href = 'index.html';
        }

        let stakeValues = JSON.parse(localStorage.getItem('userStakeButtons')) || [100, 200, 500, 1000, 2000, 5000, 10000, 25000];
        let isEditMode = false;

        function renderStakeButtons() {

        renderStakeButtons();

        function handleStakeClick(index) {
            if (isEditMode) {
                let newVal = prompt(`Enter new value for button ${index + 1}:`, stakeValues[index]);
                if (newVal !== null && !isNaN(newVal) && newVal.trim() !== "") {
                    stakeValues[index] = parseInt(newVal);

            } else {
                addStake(stakeValues[index]);

        }

        function toggleEditStake() {
            isEditMode = !isEditMode;
            const editBtn = document.getElementById('edit-btn');
            if (isEditMode) {
                editBtn.innerText = "SAVE STAKE";
                editBtn.style.background = "#ff9800";
            } else {
                editBtn.innerText = "EDIT STAKE";
                editBtn.style.background = "var(--green)";

        if(matchId) {
        db.collection("matches").doc(matchId).onSnapshot(doc => {
        RC('match-doc', 1, doc);
    if(!doc.exists) { goHome(); return; }
    currentMatch = doc.data();
    currentMatch.id = doc.id;

    document.getElementById('name-teamA').innerText = currentMatch.teamA;
    document.getElementById('name-teamB').innerText = currentMatch.teamB;

        }

// Har second real time me lock/unlock check karta hai — chahe admin ne kuch update kiya ho ya na kiya ho,
// jaise hi system time lockTimeMs cross kare, khud lock ho jayega; agar admin lock time badha/ghata de
// to onSnapshot upar wala turant naya lockTimeMs de dega aur ye interval usी se turant match kar lega.
function applyLockState() {
    if (!currentMatch) return;
    renderWhen();
    if (!isTimeTrusted()) return; // server time aane tak buttons locked hi rahenge
    const nowMs = getTrueTime();

    if (!currentMatch.lockTimeMs || nowMs < currentMatch.lockTimeMs) {
        document.getElementById('btn-teamA').classList.remove('locked-state');
        document.getElementById('btn-teamB').classList.remove('locked-state');
    } else {
        document.getElementById('btn-teamA').classList.add('locked-state');
        document.getElementById('btn-teamB').classList.add('locked-state');
        closeBetSlip();
    }
}
setInterval(applyLockState, 1000);
        // ---------------------------------------------------------
        // BYPASS LOGIC: LOAD BALANCE (DEMO vs REAL)
        // ---------------------------------------------------------
        if (user.isDemo) {
            currentBalance = parseFloat(user.balance || 0);
            document.getElementById('top-bal').innerText = Math.floor(currentBalance).toFixed(2);
        } else {
            db.collection("users").doc(user.id).onSnapshot(d => {
            RC('user-doc', 1, d);
                if(d.exists) {
                    currentBalance = parseFloat(d.data().balance || 0);
                    document.getElementById('top-bal').innerText = Math.floor(currentBalance).toFixed(2);
                }
            });
        }

        // ---------------------------------------------------------
        // BYPASS LOGIC: LOAD EXPOSURE AND PNL (DEMO vs REAL)
        // ---------------------------------------------------------
        if (user.isDemo) {
            window.updateDemoUI = async function() {
                let demoBets = JSON.parse(localStorage.getItem('demoBets') || '[]');
                let matchPnL = {}; 
                demoBets.forEach(b => {
                    if(!matchPnL[b.matchId]) matchPnL[b.matchId] = { teamA: 0, teamB: 0 };
                    let winAmt = b.amount * (b.odds / 100); 
                    if(b.selection === 'teamA') { matchPnL[b.matchId].teamA += winAmt; matchPnL[b.matchId].teamB -= b.amount; } 
                    else { matchPnL[b.matchId].teamB += winAmt; matchPnL[b.matchId].teamA -= b.amount; }
                });

                let totalExp = 0;
                let expHtml = `<div class="exp-header">ACTIVE EXPOSURE LIST</div>`;
                let hasExp = false;
                
                let matchNames = {};
                await Promise.all(Object.keys(matchPnL).map(async id => {
                    try {
                        const m = await getCachedFirst(db.collection("matches").doc(id));
                        RC('match-name', 1, m);
                        if (m.exists) matchNames[id] = `${m.data().teamA} vs ${m.data().teamB}`;
                    } catch (e) {}
                }));

                for(let mId in matchPnL) {
                    let w = Math.min(matchPnL[mId].teamA, matchPnL[mId].teamB);
                    if(w < 0) {
                        let expVal = Math.abs(w);
                        totalExp += expVal;
                        hasExp = true;
                        let mName = matchNames[mId] || "Live Match";
                        expHtml += `
                            <div class="exp-strip" onclick="window.location.href='betting.html?id=${mId}'">
                                <div class="exp-match-name">🏏 ${mName}</div>
                                <div class="exp-amt">-${Math.floor(expVal)}</div>
                            </div>
                        `;
                    }
                }
                if(!hasExp) expHtml += `<div style="padding: 15px; text-align: center; font-size: 12px; font-weight: bold; color: #555;">No Active Bets</div>`;
                
                document.getElementById('top-exp').innerText = Math.floor(totalExp);
                const dropEl = document.getElementById('exp-dropdown');
                if(dropEl) dropEl.innerHTML = expHtml;
                
                currentMatchPnL = matchPnL[matchId] || { teamA: 0, teamB: 0 };
                
                let displayA = document.getElementById('pnl-teamA');
                displayA.innerText = (currentMatchPnL.teamA >= 0 ? "+" : "") + currentMatchPnL.teamA.toFixed(2);
                displayA.className = "pnl-text " + (currentMatchPnL.teamA >= 0 ? "green-pnl" : "red-pnl");

                let displayB = document.getElementById('pnl-teamB');
                displayB.innerText = (currentMatchPnL.teamB >= 0 ? "+" : "") + currentMatchPnL.teamB.toFixed(2);
                displayB.className = "pnl-text " + (currentMatchPnL.teamB >= 0 ? "green-pnl" : "red-pnl");
            };
            window.updateDemoUI();
        } else {
            db.collection("bets").where("userId", "==", user.id).where("status", "==", "pending").onSnapshot(async snap => {
            RC('bets-listener', snap.docChanges().length, snap);
                let matchPnL = {}; 
                snap.forEach(doc => {
                    let b = doc.data();
                    if(!matchPnL[b.matchId]) matchPnL[b.matchId] = { teamA: 0, teamB: 0 };
                    let bAmt = parseFloat(b.amount || 0);
                    let bOdds = parseFloat(b.odds || 0);
                    let winAmt = bAmt * (bOdds / 100); 
                    if(b.selection === 'teamA') { matchPnL[b.matchId].teamA += winAmt; matchPnL[b.matchId].teamB -= bAmt; } 
                    else { matchPnL[b.matchId].teamB += winAmt; matchPnL[b.matchId].teamA -= bAmt; }
                });

                let totalExp = 0;
                let expHtml = `<div class="exp-header">ACTIVE EXPOSURE LIST</div>`;
                let hasExp = false;
                
                let matchNames = {};
                await Promise.all(Object.keys(matchPnL).map(async id => {
                    try {
                        const m = await getCachedFirst(db.collection("matches").doc(id));
                        RC('match-name', 1, m);
                        if (m.exists) matchNames[id] = `${m.data().teamA} vs ${m.data().teamB}`;
                    } catch (e) {}
                }));
                

                for(let mId in matchPnL) {
                    let w = Math.min(matchPnL[mId].teamA, matchPnL[mId].teamB);
                    if(w < 0) {
                        let expVal = Math.abs(w);
                        totalExp += expVal;
                        hasExp = true;
                        let mName = matchNames[mId] || "Live Match";
                        expHtml += `
                            <div class="exp-strip" onclick="window.location.href='betting.html?id=${mId}'">
                                <div class="exp-match-name">🏏 ${mName}</div>
                                <div class="exp-amt">-${Math.floor(expVal)}</div>
                            </div>
                        `;
                    }
                }
                if(!hasExp) expHtml += `<div style="padding: 15px; text-align: center; font-size: 12px; font-weight: bold; color: #555;">No Active Bets</div>`;
                
                document.getElementById('top-exp').innerText = Math.floor(totalExp);
                const dropEl = document.getElementById('exp-dropdown');
                if(dropEl) dropEl.innerHTML = expHtml;
                
                currentMatchPnL = matchPnL[matchId] || { teamA: 0, teamB: 0 };
                
                let displayA = document.getElementById('pnl-teamA');
                displayA.innerText = (currentMatchPnL.teamA >= 0 ? "+" : "") + currentMatchPnL.teamA.toFixed(2);
                displayA.className = "pnl-text " + (currentMatchPnL.teamA >= 0 ? "green-pnl" : "red-pnl");

                let displayB = document.getElementById('pnl-teamB');
                displayB.innerText = (currentMatchPnL.teamB >= 0 ? "+" : "") + currentMatchPnL.teamB.toFixed(2);
                displayB.className = "pnl-text " + (currentMatchPnL.teamB >= 0 ? "green-pnl" : "red-pnl");
            });
        }

        function updateProjectedPnL() {
            const amtStr = document.getElementById('slip-stake').value;
            const amt = parseFloat(amtStr);
            const projA = document.getElementById('proj-teamA');
            const projB = document.getElementById('proj-teamB');

            if (isNaN(amt) || amt <= 0 || !selectedTeamKey) {
                projA.style.display = 'none';
                projB.style.display = 'none';
                return;
            }

            const odds = parseFloat(document.getElementById('slip-odds').value) || 0;
            const winAmt = amt * (odds / 100);

            let newPnlA = currentMatchPnL.teamA;
            let newPnlB = currentMatchPnL.teamB;

            if (selectedTeamKey === 'teamA') { newPnlA += winAmt; newPnlB -= amt; } 
            else { newPnlA -= amt; newPnlB += winAmt; }

            projA.innerText = `» ${newPnlA >= 0 ? '+' : ''}${newPnlA.toFixed(2)}`;
            projA.style.color = newPnlA >= 0 ? 'var(--green)' : 'var(--red)';
            projA.style.display = 'inline-block';

            projB.innerText = `» ${newPnlB >= 0 ? '+' : ''}${newPnlB.toFixed(2)}`;
            projB.style.color = newPnlB >= 0 ? 'var(--green)' : 'var(--red)';
            projB.style.display = 'inline-block';
        }

        function openBetSlip(teamKey) {
            if (currentMatch.lockTimeMs && getTrueTime() >= currentMatch.lockTimeMs) {
                return; // Disabled click event logic backup
            }
            selectedTeamKey = teamKey;
            document.getElementById('slip-odds').value = teamKey === 'teamA' ? currentMatch.oddsA : currentMatch.oddsB;
            document.getElementById('slip-stake').value = "";
            document.getElementById('betslip-container').style.display = "flex";
            updateProjectedPnL(); 
        }
        // ✅ Bet accept hone par upar popup
        const _betSnd = new Audio('Bet%20Placed%20Successful.mp3'); // page khulte hi load ho jata hai, taaki bajne me delay na ho
        _betSnd.preload = 'auto';
        function showBetSuccess(teamName, amt, odds) {
            let el = document.getElementById('bet-success-pop');
            if (!el) {
                el = document.createElement('div');
                el.id = 'bet-success-pop';
                document.body.appendChild(el);
            }
            const safe = String(teamName).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            el.innerHTML = '<div class="bsp-title">✅ Bet Placed Successfully</div><div class="bsp-sub">' + safe + ' &nbsp;|&nbsp; Stake ' + amt + ' @ ' + odds + '</div>';
            el.className = 'show';
            try { _betSnd.currentTime = 0; _betSnd.play().catch(() => {}); } catch (e) {}
            clearTimeout(window._bspTimer);
            window._bspTimer = setTimeout(() => { el.className = ''; }, 1000);
        }
        // ⏳ Bet place ho rahi hai: buttons hide + beech me circle ghoome
        function setPlacing(on) {
            document.getElementById('betslip-container').classList.toggle('placing', on);
            const b = document.getElementById('btn-place');
            b.disabled = on;
            if (!on) b.innerText = "PLACE BET";
        }
        function closeBetSlip() { 
            document.getElementById('betslip-container').style.display = "none";
            selectedTeamKey = null;
            updateProjectedPnL(); 
            if(isEditMode) toggleEditStake(); 
        }
        
        function addStake(val) { document.getElementById('slip-stake').value = (parseFloat(document.getElementById('slip-stake').value) || 0) + val; updateProjectedPnL(); }
        function clearStake() { document.getElementById('slip-stake').value = ""; updateProjectedPnL(); }
        function minStake() { document.getElementById('slip-stake').value = 10; updateProjectedPnL(); }
        function maxStake() { document.getElementById('slip-stake').value = Math.floor(currentBalance); updateProjectedPnL(); }

        // 🌟 RACE-CONDITION FREE EXACT MATHEMATICAL BET PLACEMENT 🌟
        async function placeBet() {
           let amt = parseFloat(document.getElementById('slip-stake').value);
            if(isNaN(amt) || amt < 10) { alert("Minimum stake is 10 coins!"); return; }

            const odds = parseFloat(document.getElementById('slip-odds').value);
            const teamName = selectedTeamKey === 'teamA' ? currentMatch.teamA : currentMatch.teamB;

            const placeBtn = document.getElementById('btn-place');
            setPlacing(true);

            // 🛡️ Bet accept hone se PEHLE fresh SERVER time (Cloudflare, 0 reads). Phone ka time kabhi use nahi hota.
            const timeOk = await syncServerTime(1);
            if (!timeOk) {
                alert("Server time nahi mil raha. Internet check karke dobara try karo.");
                setPlacing(false);
                return;
            }
            const cutoffMs = Math.min(currentMatch.lockTimeMs || Infinity, currentMatch.tossTimeMs || Infinity);
            if (getTrueTime() >= cutoffMs) {
                alert("Market Suspended"); closeBetSlip();
                setPlacing(false);
                return;
            }

            try {
                // --- DEMO BYPASS: LOCAL PLACEMENT ---
                if (user.isDemo) {
                    let demoBets = JSON.parse(localStorage.getItem('demoBets') || '[]');
                    let pnlA = 0; let pnlB = 0;
                    
                    demoBets.filter(b => b.matchId === matchId).forEach(b => {
                        let winAmt = b.amount * (parseFloat(b.odds) || 98) / 100;
                        if(b.selection === 'teamA') { pnlA += winAmt; pnlB -= b.amount; }
                        else { pnlB += winAmt; pnlA -= b.amount; }
                    });

                    let oldWorst = Math.min(pnlA, pnlB);
                    let oldExp = oldWorst < 0 ? Math.abs(oldWorst) : 0;

                    const winAmt = amt * (odds / 100);
                    if (selectedTeamKey === 'teamA') { pnlA += winAmt; pnlB -= amt; }
                    else { pnlB += winAmt; pnlA -= amt; }

                    let newWorst = Math.min(pnlA, pnlB);
                    let newExp = newWorst < 0 ? Math.abs(newWorst) : 0;
                    
                    let marginRequired = Math.round((newExp - oldExp) * 100) / 100;

                    if (currentBalance < marginRequired) { 
                        alert("❌ Insufficient Demo Balance!"); 
                        placeBtn.innerText = "PLACE BET"; placeBtn.disabled = false;
                        return; 
                    }

                    if (marginRequired !== 0) {
                        user.balance -= marginRequired;
                        currentBalance = user.balance;
                        localStorage.setItem('userSession', JSON.stringify(user));
                        document.getElementById('top-bal').innerText = Math.floor(currentBalance).toFixed(2);
                    }
                    
                    demoBets.push({ matchId: matchId, selection: selectedTeamKey, amount: amt, odds: odds });
                    localStorage.setItem('demoBets', JSON.stringify(demoBets));
                    
                    window.updateDemoUI();
                    
                    closeBetSlip(); 
                    showBetSuccess(teamName, amt, odds); 
                    placeBtn.innerText = "PLACE BET"; placeBtn.disabled = false;
                    return;
                }

                // --- REAL LOGIC: FETCH EXACT PENDING BETS FROM DB ---
                const betSnap = await db.collection("bets")
                    .where("userId", "==", user.id)
                    .where("matchId", "==", matchId)
                    .where("status", "==", "pending")
                    .get();
RC('bets-check', Math.max(1, betSnap.size));
                let pnlA = 0;
                let pnlB = 0;

                betSnap.forEach(doc => {
                    let b = doc.data();
                    let winAmt = b.amount * ((parseFloat(b.odds) || 98) / 100);
                    if(b.selection === 'teamA') { pnlA += winAmt; pnlB -= b.amount; }
                    else { pnlB += winAmt; pnlA -= b.amount; }
                });

                let oldWorst = Math.min(pnlA, pnlB);
                let oldExp = oldWorst < 0 ? Math.abs(oldWorst) : 0;

                // 2. Add the requested new bet calculations
                const winAmt = amt * (odds / 100);
                if (selectedTeamKey === 'teamA') { pnlA += winAmt; pnlB -= amt; }
                else { pnlB += winAmt; pnlA -= amt; }

                let newWorst = Math.min(pnlA, pnlB);
                let newExp = newWorst < 0 ? Math.abs(newWorst) : 0;
                
                // 3. Exact Mathematical Margin (Rounding protects from floating point bugs like 0.000000000001)
                let marginRequired = Math.round((newExp - oldExp) * 100) / 100;

                // 4. Fetch Exact Real-time Balance
                const userDoc = await db.collection("users").doc(user.id).get();
                RC('fresh-balance', 1);
                let freshBalance = parseFloat(userDoc.data().balance || 0);

                if (freshBalance < marginRequired) { 
                    alert("❌ Insufficient Balance!"); 
                    placeBtn.innerText = "PLACE BET"; placeBtn.disabled = false;
                    return; 
                }

                // 5. Commit as Atomic Transaction
               const batch = db.batch();
if (marginRequired !== 0) {
    batch.update(db.collection("users").doc(user.id), { 
        balance: firebase.firestore.FieldValue.increment(-marginRequired),
        totalExposure: firebase.firestore.FieldValue.increment(marginRequired)   // 👈 naya
    });
}
                
                batch.set(db.collection("bets").doc(), {
                    userId: user.id, username: user.username, matchId: matchId,
                    selection: selectedTeamKey, selectionName: teamName, amount: amt, odds: odds,
                    status: 'pending', timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                await batch.commit(); 
                closeBetSlip(); 
                showBetSuccess(teamName, amt, odds);
            } catch(e) { 
                console.error(e);
                alert("Failed to place bet! Please check connection."); 
            } finally {
                setPlacing(false);
            }
        }
    </script>
