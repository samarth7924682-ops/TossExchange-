<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ TOSS EXCH - Change Password</title>
    <style>
        :root { --primary: #4a3a0f; --primary-light: #7a5c17; --accent: #ffd700; --bg: #f7f3e8; --green: #2e7d32; --red: #d32f2f; --shadow-sm: 0 2px 6px rgba(74,58,15,0.12); --shadow-md: 0 6px 18px rgba(74,58,15,0.22); }
        body { font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #2b2410; box-sizing: border-box; }
        * { box-sizing: border-box; }

        .container { padding: 14px 16px; max-width: 500px; margin: 0 auto; }

        .card { background: white; padding: 14px; border-radius: 8px; box-shadow: var(--shadow-sm); border-top: 3px solid var(--accent); }
        h3 { margin-top: 0; font-size: 13px; color: var(--primary); border-bottom: 2px solid #f3e6b8; padding-bottom: 6px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.3px; }

        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 10px; font-weight: 800; color: #7a6b4a; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
        input { width: 100%; padding: 8px 9px; border: 1px solid #eddfb0; border-radius: 6px; box-sizing: border-box; font-size: 12px; outline: none; background: #fdf9ee; color: #2b2410; }
        input:focus { border-color: var(--accent); }

        .btn-submit { background: linear-gradient(135deg, #7a5c17, #4a3a0f); color: #ffd700; border: 1px solid #ffd700; padding: 8px; width: 100%; border-radius: 6px; font-weight: 900; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.6px; transition: 0.2s; box-shadow: var(--shadow-sm); }
        .btn-submit:active { transform: scale(0.97); }

        @media (max-width: 380px) {
            .container { padding: 10px 12px; }
            .card { padding: 10px; }
            h3 { font-size: 12px; }
            label { font-size: 9px; }
            input { padding: 7px 8px; font-size: 11px; }
            .btn-submit { padding: 7px; font-size: 10px; }
        }

        @media (prefers-color-scheme: dark) {
            body { background-color: #f7f3e8 !important; color: #2b2410 !important; }
            .card { background-color: #ffffff !important; }
            h3 { color: #4a3a0f !important; }
            input { background-color: #fdf9ee !important; color: #2b2410 !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h3>🔑 Change SubAdmin Password</h3>
            
            <div class="input-group">
                <label>Current Password</label>
                <input type="password" id="oldPass" placeholder="Enter current password">
            </div>

            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="newPass" placeholder="Enter new password">
            </div>

            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPass" placeholder="Confirm new password">
            </div>

            <button class="btn-submit" onclick="changePass()" id="submitBtn">Update Password</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>

    <script>
        const subAdminSession = localStorage.getItem('adminSession');
        if(!subAdminSession) { window.location.href = "subadmin-login.html"; }
        const subAdmin = JSON.parse(subAdminSession);

        // Change Password Logic
        async function changePass() {
            const oldPass = document.getElementById('oldPass').value.trim();
            const newPass = document.getElementById('newPass').value.trim();
            const confirmPass = document.getElementById('confirmPass').value.trim();
            const btn = document.getElementById('submitBtn');

            if(!oldPass || !newPass || !confirmPass) { alert("All fields are required!"); return; }
            if(newPass !== confirmPass) { alert("New Passwords do not match!"); return; }
            if(newPass.length < 6) { alert("Password must be at least 6 characters long!"); return; }

            btn.innerText = "Updating...";
            btn.disabled = true;

            try {
                const doc = await db.collection("admins").doc(subAdmin.id).get();
                if(doc.exists && doc.data().password === oldPass) {
                    await db.collection("admins").doc(subAdmin.id).update({
                        password: newPass
                    });
                    alert("✅ Password changed successfully! Please login again.");
                    localStorage.removeItem('adminSession');
                    window.location.href = "subadmin-login.html";
                } else {
                    alert("❌ Incorrect Current Password!");
                    btn.innerText = "Update Password";
                    btn.disabled = false;
                }
            } catch(e) {
                alert("Error updating password.");
                btn.innerText = "Update Password";
                btn.disabled = false;
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>
</html>
