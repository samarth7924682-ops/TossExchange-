name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android app (WebView of live site)
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          echo '<html><body>Loading...</body></html>' > www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.tossexchange.app",
            "appName": "Toss Exchange",
            "webDir": "www",
            "server": { "url": "https://texch98.ink/", "cleartext": false }
          }
          JSON
          npx cap add android

      - name: Set app icon from logo.png
        run: |
          cd app
          mkdir assets
          convert ../logo.png -resize 1024x1024 -background none -gravity center -extent 1024x1024 assets/icon-only.png
          convert ../logo.png -resize 680x680 -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:'#121418' assets/icon-background.png
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TossExchange-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
