<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121418">
    <title>TOSS EXCH - Login</title>
    <style>
        :root { --theme-dark: #121418; --green: #2e7d32; --red: #d32f2f; --accent: #ffb703; }
        * { box-sizing: border-box; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eceff4; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }

        /* ---------- HERO (index ke header jaisa dark) ---------- */
        .hero { position: relative; background: var(--theme-dark); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 32px) 20px 78px; text-align: center; overflow: hidden; border-radius: 0 0 30px 30px; box-shadow: 0 6px 18px rgba(0,0,0,0.28); }
        .hero::before { content: ""; position: absolute; top: -130px; left: 50%; width: 380px; height: 380px; transform: translateX(-50%); background: radial-gradient(circle, rgba(255,183,3,0.30), transparent 70%); pointer-events: none; }
        .hero::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px); background-size: 18px 18px; pointer-events: none; }
        .hero > * { position: relative; z-index: 1; }
        .hero-coin { width: 78px; height: 78px; margin: 0 auto 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: #2b1d00; border: 3px solid #ffd55a; background: radial-gradient(circle at 35% 30%, #ffe48a, #f2b705 60%, #b87400); box-shadow: 0 0 0 6px rgba(255,183,3,0.15), 0 10px 24px rgba(0,0,0,0.5); animation: coinFlip 3.2s ease-in-out infinite; }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: 0.6px; line-height: 1.1; }
        .logo .dl { letter-spacing: -3px; }
        .logo .gold { color: var(--accent); }
        .tagline { margin-top: 8px; font-size: 12px; font-weight: 600; color: #aab1bf; letter-spacing: 0.3px; }
        .badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
        .badge { background: #222; padding: 5px 12px; border-radius: 20px; font-size: 11px; color: var(--accent); font-weight: bold; border: 1px solid #444; }
        @keyframes coinFlip { 0%, 55% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }

        /* ---------- CARD ---------- */
        .screen { position: relative; z-index: 2; width: 100%; max-width: 380px; margin: -50px auto 0; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 26px); }
        .login-card { position: relative; overflow: hidden; background: #ffffff; border-radius: 18px; padding: 24px 18px 18px; box-shadow: 0 12px 30px rgba(18,20,24,0.16), 0 2px 6px rgba(0,0,0,0.06); }
        .login-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #ffb703, #ffd55a, #ffb703); }
        .card-title { margin: 0; font-size: 19px; font-weight: 900; color: #111; }
        .card-sub { margin: 4px 0 18px; font-size: 12px; font-weight: 600; color: #64748b; }

        .field { position: relative; margin-bottom: 12px; }
        .field .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: 0.75; pointer-events: none; }
        .field input { width: 100%; padding: 13px 44px 13px 42px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #f6f8fb; font-family: inherit; font-size: 14px; font-weight: 600; color: #111; outline: none; transition: 0.2s; }
        .field input::placeholder { color: #94a3b8; font-weight: 600; }
        .field input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(255,183,3,0.18); }
        .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: none; font-size: 17px; cursor: pointer; opacity: 0.7; }

        .btn { width: 100%; padding: 14px; border: 0; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; transition: transform 0.15s; }
        .btn:active { transform: scale(0.97); }
        .btn-login { margin-top: 6px; background: linear-gradient(135deg, #fde047, #ffb703, #d97706); color: #2b1d00; box-shadow: 0 6px 16px rgba(255,183,3,0.40), inset 0 1px 0 rgba(255,255,255,0.5); }
        .btn-demo { background: #fff; color: var(--theme-dark); border: 2px solid var(--theme-dark); margin-bottom: 0; }
        .btn-demo:active { background: #f1f3f6; }

        /* ---------- DOWNLOAD APP ---------- */
        .dl-btn { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 16px; padding: 10px 14px; border: 0; border-radius: 14px; color: #fff; text-align: left; font-family: inherit; cursor: pointer; background: linear-gradient(135deg, #15803d, #22c55e 55%, #15803d); box-shadow: 0 8px 18px rgba(22,163,74,0.35), inset 0 1px 0 rgba(255,255,255,0.35); }
        .dl-btn::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent); transform: skewX(-20deg); animation: dlShine 3s infinite; pointer-events: none; }
        .dl-btn:active { transform: scale(0.97); }
        .dl-badge { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.25); }
        .dl-badge svg { width: 20px; height: 20px; }
        .dl-text { display: flex; flex-direction: column; line-height: 1.2; }
        .dl-title { font-size: 14px; font-weight: 900; letter-spacing: 0.4px; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,0.25); }
        .dl-sub { font-size: 11px; font-weight: 600; opacity: 0.95; }
        @keyframes dlShine { 0% { left: -60%; } 55%, 100% { left: 130%; } }

        

        .footer-text { font-size: 10px; color: #64748b; text-align: center; margin-top: 18px; line-height: 1.3; font-weight: 600; }

        /* ---------- Download hone ke baad upar wali patti ---------- */
        #ap-strip { position: fixed; top: 0; left: 0; right: 0; z-index: 100001; padding: calc(env(safe-area-inset-top, 0px) + 7px) 12px 7px; text-align: center; font-size: 12.5px; font-weight: 800; letter-spacing: 0.2px; color: #2b1d00; background: linear-gradient(180deg, #ffd45a, #f2a900); box-shadow: 0 3px 10px rgba(0,0,0,0.35); transform: translateY(-120%); transition: transform 0.3s ease; pointer-events: none; }
        #ap-strip.show { transform: translateY(0); }

        /* Force Password Change Screen (Hidden by default) */
        #change-password-screen { display: none; }
        #login-screen { display: block; }

        @media (prefers-reduced-motion: reduce) { .hero-coin, .dl-btn::after, .g::before, .g .ic { animation: none !important; } }
                /* ---------- FULL PAGE DARK BACKGROUND + COMPACT (no scroll) ---------- */
        body { background: var(--theme-dark); min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; }
        body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(circle at 50% -5%, rgba(255,183,3,0.30), transparent 55%); }
        body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px); background-size: 18px 18px; }
        .hero { background: none; box-shadow: none; border-radius: 0; overflow: visible; padding: 0 20px 14px; }
        .hero::before, .hero::after { display: none; }
        .hero-coin { width: 60px; height: 60px; font-size: 32px; margin-bottom: 10px; }
        .logo { font-size: 24px; }
        .tagline { margin-top: 5px; }
        .badges { margin-top: 10px; }
        .screen { margin: 0 auto; padding: 0 16px; }
        .login-card { padding: 18px 16px 14px; }
        .card-sub { margin-bottom: 12px; }
        .field { margin-bottom: 10px; }
        .field input { padding-top: 11px; padding-bottom: 11px; }
        .btn { padding: 12px; margin-bottom: 8px; }
        .dl-btn { margin-top: 12px; }
        .footer-text { color: #8b93a3; margin-top: 12px; }
                        /* ---------- LOGIN CARD: page ke dark theme se match ---------- */
        .login-card { background: linear-gradient(160deg, rgba(48,40,26,0.78), rgba(20,22,28,0.92)); border: 1px solid rgba(255,183,3,0.30); box-shadow: 0 12px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
        .card-title { color: #fff; }
        .card-sub { color: #aab1bf; }
        .field input { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.14); color: #fff; }
        .field input::placeholder { color: #8b93a3; }
        .field input:focus { background: rgba(255,255,255,0.10); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,183,3,0.18); }
        .field input:-webkit-autofill { -webkit-text-fill-color: #fff; -webkit-box-shadow: 0 0 0 100px #25262c inset; caret-color: #fff; }
        .btn-demo { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,183,3,0.55); }
        .btn-demo:active { background: rgba(255,255,255,0.12); }
                       /* ---------- Bada text + bade halke dots ---------- */
        .field input { height: 52px; font-size: 18px; font-weight: 600; }
        .field input::placeholder { font-size: 16px; letter-spacing: 0; }
        #password[type="password"] { font-size: 30px; letter-spacing: 4px; font-weight: 400; color: rgba(255,255,255,0.8); }
    </style>
</head>
<body>

    <!-- HERO -->
    <div class="hero">
        <div class="hero-coin">$</div>
        <div class="logo">TO<span class="dl">💲💲</span> <span class="gold">EXCHANGE</span></div>
        <div class="tagline">Fast &middot; Secure &middot; Instant</div>
        <div class="badges">
            <div class="badge">🏏 Live Matches</div>
            <div class="badge">⚡ Instant Results</div>
            <div class="badge">🎮 Games</div>
        </div>
    </div>

    <!-- MAIN LOGIN -->
    <div class="screen" id="login-screen">
        <div class="login-card">
            <h2 class="card-title">Welcome Back</h2>
            <div class="card-sub">Login to continue</div>

            <div class="field">
                <span class="ic">👤</span>
                <input type="text" id="username" placeholder="Username" autocomplete="username">
            </div>
            <div class="field">
                <span class="ic">🔒</span>
                <input type="password" id="password" placeholder="Password" autocomplete="current-password">
                                <button type="button" class="eye" onclick="togglePw('password', this)" aria-label="Show password"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#aab1bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></button>
            </div>

            <button class="btn btn-login" onclick="loginUser()">Login ➜</button>
            <button class="btn btn-demo" onclick="loginDemo()">Demo ID ➜</button>

            <button type="button" class="dl-btn" id="dl-btn" style="display:none;">
                <span class="dl-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
                </span>
                <span class="dl-text">
                    <span class="dl-title">Download App</span>
                    <span class="dl-sub">App size 3 MB</span>
                </span>
            </button>
        </div>

        

        <div class="footer-text">
            Protected by reCAPTCHA & Google Privacy Policy.
        </div>
    </div>

    <!-- FORCE CHANGE PASSWORD -->
    <div class="screen" id="change-password-screen">
        <div class="login-card">
            <h3 class="card-title" style="color:#d32f2f; text-align:center; margin-bottom:16px;">Change Default Password</h3>
            <div class="field">
                <span class="ic">🔑</span>
                <input type="password" id="cp-current" placeholder="Current Password">
            </div>
            <div class="field">
                <span class="ic">🔒</span>
                <input type="password" id="cp-new" placeholder="New Password">
            </div>
            <div class="field">
                <span class="ic">✅</span>
                <input type="password" id="cp-confirm" placeholder="Confirm New Password">
            </div>
            <button class="btn btn-login" onclick="submitNewPassword()">Save & Login ➜</button>
        </div>
    </div>

    <div id="ap-strip">&#9989; App downloaded &mdash; approve install from File Manager</div>

    <script>
        // Password dikhao / chhupao
        function togglePw(id, btn) {
            var i = document.getElementById(id);
            var show = i.type === 'password';
            i.type = show ? 'text' : 'password';
                        var eye = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>';
            btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#aab1bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + eye + (show ? '' : '<path d="M3 3l18 18"/>') + '</svg>';
        }

        // Download App (sirf Android browser me, app ke andar nahi)
        (function () {
            var APK_URL = 'https://github.com/samarth7924682-ops/TossExchange-/releases/latest/download/TossExchange.apk';
            var APK_MB = 3;          // app ka size (ETA nikalne ke liye)
            var STRIP_MS = 3000;     // patti kitni der dikhe
            try {
                var ua = navigator.userAgent || '';
                var cap = window.Capacitor && typeof window.Capacitor.getPlatform === 'function' && window.Capacitor.getPlatform() !== 'web';
                var inApp = cap || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
                var btn = document.getElementById('dl-btn');
                if (!/Android/i.test(ua) || inApp) return;      // button hidden hi rahega
                btn.style.display = 'flex';

                var strip = document.getElementById('ap-strip');
                var stripShown = false;
                function showStrip() {
                    if (stripShown) return;
                    stripShown = true;
                    strip.classList.add('show');
                    setTimeout(function () { strip.classList.remove('show'); stripShown = false; }, STRIP_MS);
                }
                function etaMs() {
                    var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                    var mbps = c && c.downlink ? c.downlink : 0;
                    var sec = mbps ? ((APK_MB * 8) / mbps) + 2 : 6;
                    return Math.min(Math.max(sec, 4), 15) * 1000;
                }
                btn.onclick = function () {
                    var a = document.createElement('a');
                    a.href = APK_URL; a.download = 'TossExchange.apk'; a.rel = 'noopener';
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(showStrip, etaMs());
                };
            } catch (e) {}
        })();
    </script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>

    <script>
        // Check if already logged in
        window.onload = function() {
            if(localStorage.getItem('userSession')) {
                window.location.replace("index.html");
            }
        }

        window.tempLoginUser = null;

        window.loginUser = async function() {
            const rawU = document.getElementById('username').value;
            const cleanU = rawU.trim().toLowerCase().replace(/\s+/g, ''); 
            const p = document.getElementById('password').value.trim();
            
            if(!cleanU || !p) { alert("Please enter both username and password!"); return; }

            const btn = document.querySelector('.btn');
            btn.innerText = "Please Wait...";

            try {
                let snap = await db.collection("users").where("usernameLower", "==", cleanU).where("password", "==", p).get();
                if(snap.empty) {
                    snap = await db.collection("users").where("username", "==", rawU.trim()).where("password", "==", p).get();
                }

                if(!snap.empty) {
                    const doc = snap.docs[0];
                    const userData = doc.data();

                    if (userData.locked) {
                        if (userData.linkedSubAdminId) {
                            const saDoc = await db.collection("admins").doc(userData.linkedSubAdminId).get();
                            const saLocked = saDoc.exists ? (saDoc.data().locked || false) : true;
                            alert(saLocked ? "🔒 Account Locked By Upline" : "🔒 Account Locked By Your Admin. Contact Your Admin.");
                        } else {
                            alert("🔒 Account Locked By Your Admin. Contact Your Admin.");
                        }
                        btn.innerText = "Login ➜"; return;
                    }

                    if (userData.passwordChanged === true) {
                        localStorage.setItem('userSession', JSON.stringify({id: doc.id, username: userData.username || rawU.trim()}));
                        window.location.replace("index.html");
                    } else {
                        window.tempLoginUser = { id: doc.id, username: userData.username || rawU.trim(), currentPass: p };
                        document.getElementById('cp-current').value = p; 
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('change-password-screen').style.display = 'block';
                    }
                } else { 
                    alert("Invalid Credentials!"); 
                    btn.innerText = "Login ➜";
                }
            } catch (error) {
                console.error("Login Error:", error);
                alert("Database connection error.");
                btn.innerText = "Login ➜";
            }
        }

        window.submitNewPassword = async function() {
            const currP = document.getElementById('cp-current').value.trim();
            const newP = document.getElementById('cp-new').value.trim();
            const confP = document.getElementById('cp-confirm').value.trim();

            if (!currP || !newP || !confP) { alert("Please fill all fields!"); return; }
            if (currP !== window.tempLoginUser.currentPass) { alert("Current password incorrect!"); return; }
            if (newP !== confP) { alert("Passwords do not match!"); return; }
            if (newP.length < 4) { alert("Minimum 4 characters required!"); return; }

            try {
                await db.collection("users").doc(window.tempLoginUser.id).update({ password: newP, passwordChanged: true });
                localStorage.setItem('userSession', JSON.stringify({ id: window.tempLoginUser.id, username: window.tempLoginUser.username }));
                window.location.replace("index.html");
            } catch(e) {
                alert("Error updating password.");
            }
        }

        window.loginDemo = function() {
            const randomNum = Math.floor(Math.random() * 100) + 1001; 
            const demoSession = {
                id: 'demo_' + randomNum,
                username: 'Demo@' + randomNum,
                isDemo: true, 
                balance: 0 
            };
            
            localStorage.removeItem('demoBets'); // Purane kisi bhi demo account ke bets — naya account fresh start hoga
            localStorage.setItem('userSession', JSON.stringify(demoSession));
            window.location.replace("index.html");
        }
    </script>
</body>
</html>
