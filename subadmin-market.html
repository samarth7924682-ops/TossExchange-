<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ TOSS EXCH - SubAdmin Market</title>
  <style>
        :root { --primary: #4a3a0f; --primary-light: #7a5c17; --accent: #ffd700; --bg: #f7f3e8; --green: #2e7d32; --red: #d32f2f; --shadow-sm: 0 2px 6px rgba(74,58,15,0.12); --shadow-md: 0 6px 18px rgba(74,58,15,0.22); color-scheme: light only; }
        html { color-scheme: light only; }
        body { font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #2b2410; margin: 0; padding: 0; }
        * { box-sizing: border-box; font-family: inherit; }

        .sa-header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: #ffd700; padding: 7px 8px; display: flex; flex-direction: column; gap: 5px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 3px 14px rgba(74,58,15,0.4); border-bottom: 2px solid var(--accent); }
        .sa-header-top { display: flex; justify-content: space-between; align-items: center; }
        .sa-logo { font-size: 13px; font-weight: 900; letter-spacing: 0.3px; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.4); cursor: pointer; }
        .sa-stats-bar { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
        .sa-badge { background: rgba(255,215,0,0.1); padding: 3px 7px; border-radius: 14px; font-size: 9px; font-weight: 800; border: 1px solid rgba(255,215,0,0.35); display: flex; align-items: center; gap: 3px; color: #ffd700; }
        .sa-badge span { color: #ffe680; font-size: 10px;}

        .container { padding: 8px 14px; max-width: 800px; margin: 0 auto; }

        .card { background: white; padding: 8px; border-radius: 8px; box-shadow: var(--shadow-sm); margin-bottom: 8px; border-left: 3px solid var(--accent); }
        h3 { margin-top: 0; font-size: 11px; color: var(--primary); border-bottom: 2px solid #f3e6b8; padding-bottom: 5px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.3px; }

        .slim-strip { display: flex; flex-direction: column; justify-content: space-between; padding: 7px; background: #fdf9ee; border: 1px solid #eddfb0; margin-bottom: 5px; border-radius: 6px; }
        .match-title { font-weight:900; font-size:12px; color:#2b2410; margin-bottom: 6px; }
        .volume-stats { font-size:10.5px; color:#444; background: white; padding: 7px; border-radius: 4px; border: 1px dashed #eddfb0;}

        .whatsapp-float-btn {
            position: fixed; bottom: 16px; right: 16px; background: #25d366; color: white; width: 44px; height: 44px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px;
            box-shadow: 0 5px 14px rgba(37,211,102,0.4); z-index: 9999; text-decoration: none; display: none; 
        }

        @media (max-width: 380px) {
            .container { padding: 8px 10px; }
            .sa-logo { font-size: 11px; }
            .sa-badge { font-size: 8px; padding: 2px 5px; }
            h3 { font-size: 10px; }
        }

        @media (prefers-color-scheme: dark) {
            html, body { background-color: #f7f3e8 !important; color: #2b2410 !important; }
            .sa-header { background-color: #4a3a0f !important; color: #ffd700 !important; }
            .card { background-color: #ffffff !important; color: #2b2410 !important; }
            .slim-strip { background-color: #fdf9ee !important; color: #2b2410 !important; border-color: #eddfb0 !important; }
            .volume-stats { background-color: #ffffff !important; color: #444 !important; }
        }
    </style>
</head>
<body>

    <div class="sa-header">
        <div class="sa-header-top">
            <div class="sa-logo" onclick="window.location.href='subadmin-dashboard.html'">TOSSEXCHANGE</div>
            <div style="font-size: 12px; font-weight: bold; color: #cbd5e1;">👤 <span id="sa-name">...</span></div>
        </div>
        <div class="sa-stats-bar">
            <div class="sa-badge">BAL: <span id="sa-bal">0.00</span></div>
            <div class="sa-badge">DOWNLINE: <span id="sa-downline">0.00</span></div>
            <div class="sa-badge" style="border-color:var(--red);">PnL: <span id="sa-pnl" style="color:var(--red);">0.00</span></div>
        </div>
    </div>

    <div class="container">
        
        <!-- Live Market Volume (Net Exact Position) -->
        <div class="card">
            <h3>🏏 SubAdmin Net Book (Market)</h3>
            <p style="font-size: 11px; color: #666; margin-top: -5px; margin-bottom: 15px;">Aapke users ka overall net exposure (Loss in Red, Profit in Green).</p>
            <div id="sa-matches-list"><p style="color: #666; font-size: 11px;">Loading live book...</p></div>
        </div>

    </div>

    <a href="#" id="wa-master-btn" class="whatsapp-float-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WA" style="width: 30px; height: 30px;">
    </a>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>

    <script>
        // 🛡️ SECURITY MIDDLEWARE
        const subAdminSession = localStorage.getItem('adminSession');
        let subAdmin = null;

        if(!subAdminSession) {
            window.location.replace("subadmin-login.html");
        } else {
            subAdmin = JSON.parse(subAdminSession);
            if(subAdmin.role !== 'subadmin') {
                localStorage.removeItem('adminSession');
                window.location.replace("subadmin-login.html");
            }
        }
        
        let currentSaBal = 0;
        let totalDownlineBal = 0;

        // Fetch Master WhatsApp
        db.collection("system_settings").doc("global").onSnapshot(doc => {
            if(doc.exists && doc.data().masterWhatsApp) {
                const waBtn = document.getElementById('wa-master-btn');
                waBtn.href = `https://wa.me/${doc.data().masterWhatsApp}?text=Hello%20Master,%20I%20am%20Subadmin:%20${subAdmin.username}`;
                waBtn.target = "_blank";
                waBtn.style.display = "flex";
            }
        });

        // Load Header Stats & PnL
        document.getElementById('sa-name').innerText = subAdmin.username;
        db.collection("admins").doc(subAdmin.id).onSnapshot(doc => {
            if(doc.exists) {
                currentSaBal = doc.data().balance || 0;
                document.getElementById('sa-bal').innerText = Math.floor(currentSaBal);
                calcPnL();
            }
        });

        db.collection("users").where("linkedSubAdminId", "==", subAdmin.id).onSnapshot(snap => {
            totalDownlineBal = 0;
            snap.forEach(doc => { totalDownlineBal += (doc.data().balance || 0); });
            document.getElementById('sa-downline').innerText = Math.floor(totalDownlineBal);
            calcPnL();
        });

        function calcPnL() {
            let pnl = currentSaBal - totalDownlineBal; 
            let pnlEl = document.getElementById('sa-pnl');
            pnlEl.innerText = (pnl >= 0 ? '+' : '') + Math.floor(pnl);
            pnlEl.style.color = pnl >= 0 ? "var(--green)" : "var(--red)";
            }
            function getRelativeDateLabel(ms) {
            if(!ms) return "UNKNOWN DATE";
            const d = new Date(ms); const today = new Date(); const tmrw = new Date(); tmrw.setDate(today.getDate() + 1);
            if(d.toDateString() === today.toDateString()) return "TODAY";
            if(d.toDateString() === tmrw.toDateString()) return "TOMORROW";
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            return `${d.getDate()} ${months[d.getMonth()]}`;
        }
        
        // 🌟 FINAL EXACT NET VOLUME (BOOK) LOGIC 🌟
        async function initLiveMarket() {
            // Get all downline users
            const uSnap = await db.collection("users").where("linkedSubAdminId", "==", subAdmin.id).get();
            let myUserIds = [];
            uSnap.forEach(d => myUserIds.push(d.id));

            // 👇 Dono listeners ab SIRF EK BAAR attach honge — nested nahi
            let latestMatchSnap = null;
            let latestBetSnap = null;

            function renderMarket() {
                if (!latestMatchSnap) return; // matches abhi load hi nahi hue

                const listVolume = document.getElementById('sa-matches-list');
                listVolume.innerHTML = "";

                if(latestMatchSnap.empty) { 
                    listVolume.innerHTML = "<p style='color:#777; font-size:12px;'>No active matches right now.</p>"; 
                    return; 
                }

                // Store combined subadmin net book here
                let saBook = {}; 

                if (latestBetSnap) {
                    latestBetSnap.forEach(bDoc => {
                        const b = bDoc.data();
                        
                        if(myUserIds.includes(b.userId)) { 
                            if(!saBook[b.matchId]) saBook[b.matchId] = { teamA: 0, teamB: 0 };
                            
                            // EXACT MATH: Profit = Stake * (Odds/100) | Loss = Stake
                            let netProfit = b.amount * ((parseFloat(b.odds) || 98) / 100);
                            let netLoss = b.amount; 

                            // Calculate overall book
                            if(b.selection === 'teamA') {
                                saBook[b.matchId].teamA += netProfit; // Win logic
                                saBook[b.matchId].teamB -= netLoss;   // Loss logic
                            } else {
                                saBook[b.matchId].teamB += netProfit; // Win logic
                                saBook[b.matchId].teamA -= netLoss;   // Loss logic
                            }
                        }
                    });
                }

                // Render UI (sorted by match time - increasing order)
                let sortedMatches = [];
                latestMatchSnap.forEach(doc => sortedMatches.push({ id: doc.id, ...doc.data() }));
                sortedMatches.sort((a, b) => (a.tossTimeMs || 0) - (b.tossTimeMs || 0));

                sortedMatches.forEach(m => {
                    const book = saBook[m.id] || { teamA: 0, teamB: 0 };
                    
                    let colorA = book.teamA >= 0 ? "var(--green)" : "var(--red)";
                    let signA = book.teamA > 0 ? "+" : ""; 
                    
                    let colorB = book.teamB >= 0 ? "var(--green)" : "var(--red)";
                    let signB = book.teamB > 0 ? "+" : "";

                    listVolume.innerHTML += `
                        <div class="slim-strip">
                            <div class="match-title">🏏 ${m.teamA} vs ${m.teamB}</div>
                            <div style="font-size:11px; font-weight:bold; color:#666; margin-bottom:6px;">📅 ${getRelativeDateLabel(m.tossTimeMs)} • ${m.tossTimeMs ? new Date(m.tossTimeMs).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '--:--'}</div>
                            <div class="volume-stats">
                                <div style="display:flex; justify-content:space-between; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid #eee;">
                                    <span style="font-weight:bold; font-size:13px;">${m.teamA}:</span> 
                                    <span style="color:${colorA}; font-weight:900; font-size: 14px;">${signA}${book.teamA.toFixed(2)}</span>
                                </div>
                                <div style="display:flex; justify-content:space-between;">
                                    <span style="font-weight:bold; font-size:13px;">${m.teamB}:</span> 
                                    <span style="color:${colorB}; font-weight:900; font-size: 14px;">${signB}${book.teamB.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            db.collection("matches").where("status", "==", "open").onSnapshot(matchSnap => {
                latestMatchSnap = matchSnap;
                renderMarket();
            });

            db.collection("bets").where("status", "==", "pending").onSnapshot(betSnap => {
                latestBetSnap = betSnap;
                renderMarket();
            });
        }
        
        initLiveMarket();
    </script>
</body>
</html>
